# Nota sobre configuracion: NO se usa `env_file: .env` porque `.env` esta en
# .gitignore y un clon limpio del repositorio no lo tiene, lo que hacia fallar
# `docker compose up` con "env file .env not found". En su lugar se usa
# interpolacion `${VAR:-default}`: Compose lee automaticamente el archivo .env
# del directorio del proyecto si existe, y si no existe aplica los defaults.
# El stack levanta con o sin .env.
services:
  postgres:
    image: postgres:16
    container_name: taxi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxi_dw}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxi_user} -d ${POSTGRES_DB:-taxi_dw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: taxi_api_flask
    restart: always
    environment:
      # POSTGRES_HOST es siempre el nombre del servicio dentro de la red de Compose,
      # no lo que diga el .env (que apunta a localhost para la ejecucion local).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taxi_dw}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      API_WORKERS: ${API_WORKERS:-2}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/v1/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    container_name: taxi_etl_pipeline
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taxi_dw}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
      TAXI_TYPE: ${TAXI_TYPE:-yellow}
      START_YEAR: ${START_YEAR:-2024}
      START_MONTH: ${START_MONTH:-1}
      MONTHS_TO_PROCESS: ${MONTHS_TO_PROCESS:-3}
    volumes:
      # Los Parquet descargados se cachean en el host: reejecutar el pipeline no
      # vuelve a bajar ~500 MB por mes.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    # Perfil `etl`: no arranca con `docker compose up`, se invoca a demanda con
    # `docker compose --profile etl run --rm etl ...`
    profiles:
      - etl

volumes:
  postgres_data:
